<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virus!</title>
<meta name="description" content="Virus! el juego de cartas, en línea y sin cuentas">
<meta name="theme-color" content="#0F473A">
<script>window.VIRUS_BUILD='28-oct 00:47';</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Virus!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #E8EEF1;
  --panel: #F8FAFB;
  --ink: #12212C;
  --mute: #5A6D7A;
  --line: #C4D1D9;
  --red: #D6424B;
  --green: #2E9A5C;
  --blue: #3B69CF;
  --yellow: #D9A528;
  --treat: #6A4A9C;
  --accent: #0E6F73;
  --accent-ink: #FFFFFF;
  --warn: #B3341F;
  --glow: rgba(14, 111, 115, .28);
  --card: #FBFAF6; --card-ink: #13222C;
  --felt-a: #21806A; --felt-b: #0F473A; --rim: #2A1E17;
  --on-felt: #EAF4EF; --on-felt-dim: rgba(234, 244, 239, .74); --plate: rgba(5, 22, 18, .42);
  --gold: #F4D35E; --mint: #9FE8D0; --v-red: #C23B2D; --m-teal: #0E7C80;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --felt-a: #17594A; --felt-b: #0A2D26; --rim: #14100E;
    --bg: #0E1920; --panel: #16252E; --ink: #E4EDF1; --mute: #93A7B3; --line: #2A3D49;
    --red: #EE6169; --green: #4CBB7C; --blue: #6C93EE; --yellow: #EBBF4C; --treat: #A484DB;
    --accent: #37B5B9; --accent-ink: #06191A; --warn: #F08A76; --glow: rgba(55, 181, 185, .35);
  }
}
:root[data-theme="dark"] {
  --felt-a: #17594A; --felt-b: #0A2D26; --rim: #14100E;
  --bg: #0E1920; --panel: #16252E; --ink: #E4EDF1; --mute: #93A7B3; --line: #2A3D49;
  --red: #EE6169; --green: #4CBB7C; --blue: #6C93EE; --yellow: #EBBF4C; --treat: #A484DB;
  --accent: #37B5B9; --accent-ink: #06191A; --warn: #F08A76; --glow: rgba(55, 181, 185, .35);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.4 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
h1, h2, h3 { font-family: "Bricolage Grotesque", "Public Sans", system-ui, sans-serif; margin: 0; letter-spacing: -.01em; }
html, body { height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.pad { padding: 16px; }

/* Pantallas de entrada y sala */
.hero { padding: 40px 20px 8px; }
.hero h1 { font-size: 56px; font-weight: 800; line-height: .95; }
.hero p { margin: 10px 0 0; color: var(--mute); max-width: 30ch; }
.card-box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 16px; }
label { display: block; font-weight: 600; margin-bottom: 6px; }
input[type=text] {
  width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--ink); font: inherit; font-size: 17px;
}
.code-in { text-transform: uppercase; letter-spacing: .25em; font-weight: 700; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.stack > * + * { margin-top: 12px; }
.btn {
  border: 0; border-radius: 10px; padding: 12px 14px; font-weight: 700; min-height: 46px;
  background: var(--accent); color: var(--accent-ink);
}
.btn.alt { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { min-height: 40px; padding: 8px 12px; }
.btn[disabled] { opacity: .45; cursor: default; }
.err { color: var(--warn); font-weight: 600; margin: 10px 0 0; }
.note { color: var(--mute); font-size: 13px; }
.room-code { font: 800 64px/1 "Bricolage Grotesque", sans-serif; letter-spacing: .12em; margin: 4px 0; }
.plist { list-style: none; padding: 0; margin: 12px 0 0; }
.plist li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
details.rules { margin: 0 16px 24px; color: var(--mute); }
details.rules summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.rules p { margin: 8px 0; }


/* Sala de espera */
.card-box h3 { font-size: 18px; margin-bottom: 8px; }
.invite { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); border: 1.5px solid var(--accent); border-radius: 10px; padding: 8px 12px; margin: 0; }
.btn.wa { background: #1FA855; color: #fff; text-decoration: none; display: grid; place-items: center; text-align: center; }
.share { margin-top: 0; }
.copybox { margin-top: 8px; width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; }
.pl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.av.sm { width: 38px; height: 38px; font-size: 22px; }
.avgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.avbtn { aspect-ratio: 1; font-size: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center; padding: 1px; overflow: hidden; }
.avbtn.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--bg)); }
.avbtn[disabled] { opacity: .3; cursor: default; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
.opt[disabled] { opacity: .55; cursor: default; }
.ot-t { font-weight: 700; }
.ot-d { font-size: 12.5px; color: var(--mute); line-height: 1.3; }
/* Aviso de red */
.netbar { background: #B3341F; color: #fff; text-align: center; font-weight: 600; font-size: 13px; padding: 6px 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 7; }

/* Mesa */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.top .turn { font-weight: 700; }
.top .turn.mine { color: var(--accent); }
.topr { display: flex; align-items: center; gap: 10px; }
.menubtn { border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; width: 38px; height: 34px; font-size: 20px; line-height: 1; padding: 0 0 4px; }
.menupanel { background: var(--panel); border-bottom: 1.5px solid var(--line); padding: 10px 14px 12px; display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 4; }
.menupanel .note { margin: 0; }
.top #tt { font-weight: 600; color: var(--mute); }
.top #tt.low { color: var(--warn); }
.seat.idle .plate { opacity: .6; }
.top .code { color: var(--mute); font-size: 13px; letter-spacing: .12em; font-weight: 600; }

.felt {
  position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  padding: 16px 10px 12px; color: var(--on-felt); overflow: hidden; min-height: 460px;
  background: radial-gradient(ellipse at 50% 42%, var(--felt-a), var(--felt-b) 78%);
  box-shadow: inset 0 0 0 7px var(--rim), inset 0 0 46px rgba(0, 0, 0, .5);
}
.felt::before { content: ""; position: absolute; inset: 16px; border: 2px solid rgba(255, 255, 255, .13); border-radius: 48px; pointer-events: none; }
.felt > * { position: relative; }
.stage { display: grid; grid-template-columns: var(--side, 92px) 1fr var(--side, 92px); grid-template-rows: auto 1fr; gap: 6px 4px; flex: 1; }
.row-top { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 6px; }
.row-top .seat { flex: 1 1 0; }
.col-left { grid-row: 2; grid-column: 1; align-self: center; }
.col-right { grid-row: 2; grid-column: 3; align-self: center; }
.center { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-width: 0; }

.seat { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; border-radius: 16px; }
.plate { min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--plate); border-radius: 999px; padding: 3px 10px 3px 3px; max-width: 100%; border: 2px solid transparent; }
.seat.turn .plate { border-color: var(--gold); box-shadow: 0 0 14px rgba(244, 211, 94, .55); }
.seat.target { outline: 3px solid var(--mint); outline-offset: 3px; background: rgba(159, 232, 208, .12); }
.av { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--av, #4A6FA5); font-size: 24px; line-height: 1; }
.who { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; overflow: hidden; }
.nm { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 96px; }
.nm small { font-size: 10px; }

.sub { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--on-felt-dim); }
.cnt { display: inline-flex; align-items: center; gap: 3px; }
.cnt i { width: 9px; height: 13px; border-radius: 2px; border: 1px solid #fff; background: repeating-linear-gradient(45deg, #2E5BA8 0 3px, #244A8A 3px 6px); }
.pips { display: inline-flex; gap: 2px; }
.pips b { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .22); }
.pips b.on { background: var(--gold); }
.seat.side .plate { flex-direction: column; border-radius: 14px; padding: 5px 7px; gap: 3px; text-align: center; }
.seat.side .who { align-items: center; }
.seat.side .nm { max-width: 76px; }
.obody { display: flex; flex-wrap: wrap; gap: 6px 5px; justify-content: center; min-height: 60px; align-content: flex-start; }
.empty { color: var(--on-felt-dim); font-size: 12px; align-self: center; }

/* Órganos en mesa: la carta con sus virus y medicinas debajo */
.ot { position: relative; background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; color: inherit; }
.ot .oart { display: block; border-radius: 7px; box-shadow: 0 2px 5px rgba(0, 0, 0, .45); transition: box-shadow .15s, transform .15s; }
.ot .oart svg, .att svg, .card svg { display: block; width: 100%; height: auto; }
.ot.sm .oart { width: 40px; }
.ot.lg .oart { width: 66px; border-radius: 9px; }
.ot .os { display: none; font-size: 11px; font-weight: 700; color: var(--on-felt); }
.ot.lg .os { display: block; }
.atts { display: flex; gap: 2px; justify-content: center; min-height: 22px; }
.ot.sm .att { width: 17px; }
.ot.lg .att { width: 24px; }
.att { display: block; border-radius: 3px; box-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.ot.infected .oart { box-shadow: 0 0 0 2.5px #E04652, 0 0 10px 1px #E04652; }
.ot.vacc .oart { box-shadow: 0 0 0 2.5px #fff, 0 0 0 4.5px #5C8FE0, 0 2px 8px rgba(0, 0, 0, .4); }
.ot.immune .oart { box-shadow: 0 0 0 2.5px var(--gold), 0 0 14px 3px var(--gold); }
.ot.infected .os { color: #FF9C8E; }
.ot.vacc .os, .ot.immune .os { color: var(--mint); }
.ot.target .oart { box-shadow: 0 0 0 3px var(--mint), 0 0 18px var(--mint); transform: translateY(-3px); }
.ot.picked .oart { box-shadow: 0 0 0 3px #CBB0F7, 0 0 18px #CBB0F7; }
.ot.dim { opacity: .42; }

.piles { display: flex; gap: 20px; align-items: flex-end; }
.pile { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; color: var(--on-felt-dim); }
.pile b { color: var(--on-felt); font-size: 15px; }
.backcard { width: 54px; height: 76px; border-radius: 8px; border: 2px solid #fff; background: repeating-linear-gradient(45deg, #2E5BA8 0 5px, #244A8A 5px 10px); box-shadow: 2px 2px 0 rgba(0, 0, 0, .35), 4px 4px 0 rgba(0, 0, 0, .22); }
.slot { width: 54px; height: 76px; border: 2px dashed rgba(255, 255, 255, .28); border-radius: 8px; }
.quar { font-size: 12px; color: var(--on-felt-dim); }
.last { background: var(--plate); border-radius: 12px; padding: 5px 10px; font-size: 12.5px; text-align: center; max-width: 100%; min-height: 2.5em; display: grid; place-items: center; }
details.log { width: 100%; color: var(--on-felt-dim); font-size: 12.5px; text-align: center; }
details.log summary { cursor: pointer; }
details.log div { padding: 2px 0; }
.mine-row { display: flex; justify-content: center; }
.overlay { position: absolute !important; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(4, 18, 15, .78); padding: 16px; }
.overlay .card-box { margin: 0; width: min(100%, 340px); color: var(--ink); text-align: center; }
.ask h2 { font-size: 24px; margin-bottom: 4px; }
.ask p { margin: 4px 0 8px; }
.ask .cd { color: var(--mute); font-size: 13px; margin: 0 0 8px; }
.ask .cd b { color: var(--accent); font-size: 16px; }
.askcard { width: 96px; margin: 0 auto 10px; transform: rotate(-3deg); filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .35)); }

/* Mano */
.tray { position: sticky; bottom: 0; background: var(--panel); border-top: 1.5px solid var(--line); padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.hint { margin: 0 0 2px; font-size: 13.5px; min-height: 20px; text-align: center; }
.hint b { color: var(--accent); }
.hand { display: flex; justify-content: center; align-items: flex-end; padding: 14px 0 4px; min-height: 150px; }
.card {
  flex: none; width: 92px; margin: 0 -7px; position: relative; padding: 0; border: 0; background: none; border-radius: 10px; font: inherit;
  filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .35));
  transform: translateY(var(--ty, 0)) rotate(var(--rot, 0deg)); transform-origin: 50% 130%; transition: transform .15s;
}
.hand .card:nth-child(1) { --rot: -7deg; --ty: 6px; }
.hand .card:nth-child(3) { --rot: 7deg; --ty: 6px; }
.hand .card.sel { --rot: 0deg; --ty: -18px; z-index: 3; filter: drop-shadow(0 10px 12px rgba(0, 0, 0, .5)); }
.card.dsel { outline: 3px solid var(--warn); outline-offset: 1px; --ty: -10px; }
.card.mini { width: 54px; margin: 0; --rot: -5deg; filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, .3)); }
.bar { display: flex; gap: 8px; margin-top: 8px; }
.bar .btn { flex: 1; }
.wrapbar { flex-wrap: wrap; }
.wrapbar .btn { flex: 1 1 130px; }
.banner { text-align: center; padding: 22px 16px; }
.banner h2 { font-size: 30px; }

@keyframes pop { from { transform: scale(.45) translateY(-28px); opacity: 0; } to { transform: none; opacity: 1; } }
.pop { animation: pop .38s ease-out; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .pop { animation: none; } .ot .oart { transition: none; } }
@media (min-width: 420px) { .hero h1 { font-size: 64px; } }

/* ---- chat de voz ---- */
.vbtn { position: relative; width: 38px; font-size: 17px; padding: 0 0 2px; }
.vbtn:not(.on) { opacity: .75; }
.vbtn:not(.on)::after { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 2px; background: var(--warn); border-radius: 2px; transform: rotate(-35deg); }
.vbtn.on { background: var(--green); border-color: var(--green); }
.vbtn.busy { opacity: .5; }
.vbtn.hear { box-shadow: 0 0 0 3px var(--glow), 0 0 0 5px var(--accent); }
.netbar.vbar { background: var(--warn); }
@media (prefers-reduced-motion: no-preference) { .vbtn { transition: box-shadow .12s, background .15s; } }

/* ---- botón de instalar la app ---- */
.installpill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: none; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 11px 18px; font: 700 14px/1 'Public Sans', system-ui, sans-serif; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(0, 0, 0, .28); }
.installpill.show { display: inline-flex; }

/* ---- órgano que era multicolor ---- */
.ot { position: relative; }
.ot .wb { position: absolute; top: -5px; left: -5px; z-index: 3; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1.5px solid var(--line); font-size: 11px; line-height: 15px; text-align: center; pointer-events: none; }

/* ---- animación de la jugada ---- */
.fx { position: fixed; z-index: 40; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; will-change: transform, opacity; }
.fx-cards { display: flex; gap: 6px; filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .55)); }
.fx-card svg { display: block; width: 100%; height: auto; }
.fx-cap { background: rgba(8, 20, 24, .86); color: #fff; border-radius: 12px; padding: 6px 12px; font-size: 13px; line-height: 1.3; text-align: center; max-width: 290px; box-shadow: 0 4px 14px rgba(0, 0, 0, .4); }
.fx-cap b { font-weight: 700; }
.fx-cap span { display: block; font-size: 12px; opacity: .85; }

/* ---- versión y actualización ---- */
.ver { text-align: center; margin: 10px 14px; }
.linkbtn { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; padding: 0; cursor: pointer; }
#updbar { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); z-index: 60; display: none; align-items: center; justify-content: center; gap: 10px; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; font-size: 13px; font-weight: 600; }
#updbar.show { display: flex; }
#updbar button { border: 0; border-radius: 8px; padding: 6px 12px; font: inherit; font-weight: 700; background: #fff; color: #12212C; }

/* ---- marcador ---- */
.score { display: flex; flex-direction: column; gap: 6px; }
.srow { display: flex; align-items: center; gap: 10px; }
.srow .snm { flex: 1; font-weight: 600; }
.srow b { font-size: 18px; min-width: 24px; text-align: right; }
.sav { font-size: 20px; }
.scoreline { text-align: center; margin: 4px 0 10px; }

/* ---- reacciones ---- */
.rbtn { width: 38px; font-size: 17px; padding: 0 0 2px; }
.rbtn.on { background: var(--accent); border-color: var(--accent); }
.reacttray { position: fixed; z-index: 35; right: 8px; top: calc(54px + env(safe-area-inset-top, 0px)); display: flex; gap: 4px; padding: 6px; background: rgba(10, 24, 28, .94); border-radius: 14px; box-shadow: 0 8px 22px rgba(0, 0, 0, .4); }
.reacttray button { font-size: 24px; width: 42px; height: 42px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .08); line-height: 1; }
.reacttray button:active { background: rgba(255, 255, 255, .22); }
.rfx { position: fixed; z-index: 45; pointer-events: none; display: flex; flex-direction: column; align-items: center; width: 48px; }
.rfx span { font-size: 38px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .45)); }
.rfx small { font-size: 11px; font-weight: 700; color: #fff; background: rgba(8, 20, 24, .78); border-radius: 8px; padding: 1px 6px; margin-top: 2px; white-space: nowrap; }

/* ---- ayuda de cartas ---- */
.hand .card, .hand button { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.helpbox { display: flex; gap: 14px; align-items: flex-start; max-width: 340px; }
.helpcard { width: 96px; flex: none; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .35)); }
.helpcard svg { display: block; width: 100%; height: auto; }
.helptxt h3 { margin: 0 0 6px; font-size: 16px; }
.helptxt p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.4; }

/* ---- historial ---- */
.loglink { margin-top: 4px; border: 0; background: rgba(255, 255, 255, .1); color: inherit; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12px; font-weight: 600; }
.histbox { width: min(92vw, 420px); max-height: 78vh; display: flex; flex-direction: column; padding: 14px; }
.histhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.histhead h3 { margin: 0; }
.histlist { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.histlist li { display: flex; gap: 8px; font-size: 13.5px; line-height: 1.35; padding: 5px 4px; border-bottom: 1px solid var(--line); }
.histlist li:first-child { background: rgba(31, 138, 112, .12); border-radius: 8px; }
.hav { flex: none; width: 22px; text-align: center; }
.helpov, .histov { z-index: 50; }

/* ---- Truco o trato: carta maldita junto al nombre ---- */
.curse { flex: none; width: 38px; margin: -6px -4px -6px 2px; transform: rotate(7deg); filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .5)); border-radius: 5px; box-shadow: 0 0 0 2px #FF9F3A, 0 0 12px rgba(255, 159, 58, .85); }
.curse svg { display: block; width: 100%; height: auto; }
.seat.side .curse { margin: 2px 0 -2px; transform: rotate(-4deg); }
@media (prefers-reduced-motion: no-preference) { .curse { animation: cursepulse 2.2s ease-in-out infinite; } }
@keyframes cursepulse { 0%, 100% { box-shadow: 0 0 0 2px #FF9F3A, 0 0 8px rgba(255, 159, 58, .6); } 50% { box-shadow: 0 0 0 2px #FFC46B, 0 0 16px rgba(255, 159, 58, 1); } }

/* ---- avatares dibujados ---- */
.avsvg { display: block; width: 100%; height: 100%; }
.av { overflow: hidden; }
.avbtn .avsvg { border-radius: 50%; }
.avbtn.on { box-shadow: 0 0 0 2px var(--accent); }
.fxav { display: inline-block; width: 26px; height: 26px; vertical-align: middle; }
.sav { width: 34px; height: 34px; flex: none; display: block; }
.hav { width: 30px; height: 30px; display: block; }
.fx-cap .fxav { display: inline-block; opacity: 1; font-size: inherit; margin-right: 2px; }

/* ---- volumen de efectos ---- */
.vol { display: flex; align-items: center; gap: 10px; margin: 2px 4px 6px; font-size: 13px; }
.vol input { flex: 1; accent-color: var(--accent); }

/* ---- selectores de opciones (tiempo por turno, dificultad de bots) ---- */
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.segbtn { flex: 1 1 auto; min-width: 58px; padding: 10px 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); font: inherit; font-weight: 700; color: inherit; }
.segbtn.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.segbtn:disabled:not(.on) { opacity: .55; }

/* ---- foto de perfil ---- */
.avimg { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.photorow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.photobtn { position: relative; cursor: pointer; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

/* ---- estadísticas y compartir ---- */
.stl { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--mute); }
.statsov, .shareov { z-index: 50; }
.statsbox, .sharebox { width: min(92vw, 400px); max-height: 86vh; overflow-y: auto; padding: 14px; }
.stgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stc { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
.stc b { display: block; font-size: 22px; }
.stc span { font-size: 11.5px; color: var(--mute); }
.stdots { display: flex; gap: 6px; flex-wrap: wrap; }
.stdots i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
.stdots i.w { background: #35A363; } .stdots i.l { background: #E04652; }
.shareimg { display: block; width: 100%; height: auto; border-radius: 12px; margin: 6px 0 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, .3); }
.sharebox .bar a.btn { text-align: center; text-decoration: none; }

/* ---- frases rápidas ---- */
.reacttray { flex-wrap: wrap; width: min(304px, calc(100vw - 16px)); }
.reacttray .rphr { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; margin-top: 2px; }
.reacttray .rphr button { width: auto; height: 34px; padding: 0 10px; font-size: 13px; font-weight: 700; color: #fff; }
.rfx.txt { width: auto; max-width: 220px; }
.rfx.txt span { font-size: 15px; font-weight: 800; background: #fff; color: #12212C; padding: 6px 12px; border-radius: 14px; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .4)); white-space: nowrap; }

</style>

<script>
/* Red directa entre navegadores (WebRTC con PeerJS), sin cuentas ni servidor propio.
   El anfitrión guarda la partida; los demás se conectan a él y reciben cada cambio.
   Expone la misma interfaz mínima que la base de datos compartida (doc.get/set/update/delete/onSnapshot),
   así la interfaz del juego funciona igual en las dos versiones. */
(function () {
  'use strict';
  const Q = new URLSearchParams(location.search);
  const PS = Q.get('ps'); // 'host:puerto' de un servidor de señales propio (solo para pruebas)
  const clone = o => JSON.parse(JSON.stringify(o));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { } }
  };
  function merge(a, b) {
    Object.keys(b).forEach(k => {
      if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], b[k]);
      else a[k] = clone(b[k]);
    });
    return a;
  }

  function peerOpts() {
    const o = { debug: 0 };
    if (PS) { const p = PS.split(':'); o.host = p[0]; o.port = +p[1]; o.path = '/'; o.secure = false; o.config = { iceServers: [] }; }
    else o.config = { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' },
      { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' }
    ] };
    return o;
  }

  let myId = store.get('virus.uid');
  if (!myId) { myId = 'g_' + Math.random().toString(36).slice(2, 10); store.set('virus.uid', myId); }

  const N = { role: null, code: null, peer: null, conns: {}, conn: null, doc: null, subs: [], retry: null, leaving: false, status: 'ok', lostAt: 0, claiming: false, nextClaim: 0, lastMsg: 0 };
  const GRACE = (+Q.get('gr')) || 3000, RANKSTEP = Math.max(500, Math.round(GRACE * 0.7)); // cuánto esperar antes de tomar el control de la sala (gr= solo para pruebas)
  const HB = (+Q.get('hb')) || 2000; // latido del anfitrión: si en 4 latidos no llega nada, se da por perdido (hb= solo para pruebas)

  const snap = () => ({ exists: N.doc != null, data: () => N.doc == null ? undefined : clone(N.doc) });
  function notify() { const s = snap(); N.subs.slice().forEach(f => { try { f(s); } catch (e) { console.error(e); } }); }
  function setStatus(s) { if (N.status === s) return; N.status = s; window.__netState = s; try { window.dispatchEvent(new Event('virus-net')); } catch (e) { } }
  const codeOf = path => String(path).split('/')[1];


  // ---------- chat de voz (malla de llamadas WebRTC entre todos los jugadores) ----------
  // Todos contestan las llamadas entrantes y reproducen el audio; solo quien enciende su micrófono llama a los demás.
  const V = { on: false, busy: false, err: '', stream: null, calls: {}, audios: {}, peers: [], timer: null, meters: {}, ctx: null, pending: [], hear: false, errT: null };
  const vEmit = () => { try { window.dispatchEvent(new Event('virus-voice')); } catch (e) { } };
  function vErr(m) { V.err = m || ''; if (V.errT) clearTimeout(V.errT); if (m) V.errT = setTimeout(() => { V.err = ''; vEmit(); }, 9000); }
  function vCtx() { if (!V.ctx) { try { V.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (V.ctx && V.ctx.state === 'suspended') { try { V.ctx.resume(); } catch (e) { } } return V.ctx; }
  function meterFor(key, stream) {
    try {
      const c = vCtx(); if (!c) return;
      const an = c.createAnalyser(); an.fftSize = 512;
      const src = c.createMediaStreamSource(stream); src.connect(an);
      V.meters[key] = { an, src, buf: new Uint8Array(an.fftSize), lvl: 0 };
    } catch (e) { }
  }
  function dropMeter(key) { const m = V.meters[key]; if (m) { try { m.src.disconnect(); } catch (e) { } delete V.meters[key]; } }
  function level(key) {
    const m = V.meters[key]; if (!m) return 0;
    m.an.getByteTimeDomainData(m.buf);
    let sum = 0; for (let i = 0; i < m.buf.length; i++) { const d = (m.buf[i] - 128) / 128; sum += d * d; }
    return Math.sqrt(sum / m.buf.length);
  }
  function maxRemote() { let mx = 0; Object.keys(V.meters).forEach(k => { if (k !== '_me') mx = Math.max(mx, level(k)); }); return mx; }
  function tickMeters() {
    const hear = maxRemote() > 0.02;
    if (hear !== V.hear) { V.hear = hear; document.querySelectorAll('.vbtn').forEach(b => b.classList.toggle('hear', hear)); }
  }
  function playStream(key, stream) {
    let a = V.audios[key];
    if (!a) { a = document.createElement('audio'); a.autoplay = true; a.setAttribute('playsinline', ''); a.style.display = 'none'; document.body.appendChild(a); V.audios[key] = a; }
    a.srcObject = stream;
    const p = a.play(); if (p && p.catch) p.catch(() => { if (V.pending.indexOf(a) < 0) V.pending.push(a); });
    dropMeter(key); meterFor(key, stream);
    if (!V.timer) V.timer = setInterval(vTick, 250);
  }
  function stopStream(key) {
    const a = V.audios[key]; if (a) { try { a.pause(); } catch (e) { } a.srcObject = null; if (a.parentNode) a.parentNode.removeChild(a); delete V.audios[key]; }
    V.pending = V.pending.filter(x => x !== a); dropMeter(key);
  }
  // El navegador a veces bloquea la reproducción hasta que el usuario toca la pantalla

  const convBlocked = (g, pid, sl, cc) => sl.o.c === 'wild' && isColor(cc) && g.bodies[pid].some(s => s !== sl && s.o.c === cc);
  const convert = (sl, cc) => { if (sl.o.c === 'wild' && isColor(cc)) { sl.o.orig = 'wild'; sl.o.c = cc; } };
  const unconvert = o => { if (o && o.orig) { o.c = o.orig; delete o.orig; } return o; };

  const cursed = (g, u) => !!(g.curse && g.curse.at === u);
  // Duelo: 5 órganos sanos, pero solo si hay un 5.º órgano posible (el biónico de Evolution); el multicolor, al convertirse, ocupa un color
  const goal = g => (g.opts && g.opts.duel && g.opts.evo && g.order.length === 2) ? 5 : 4;
  const canWin = (g, u) => healthy(g, u) >= goal(g) && !cursed(g, u);
  const hasSuit = (g, p) => g.hands[p].some(c => c.t === 'x' && c.k === 'suit');
  const opt = (g, k) => !!(g.opts && g.opts[k]);

  function newGame(g0) {

    const order = shuffle(ids);
    const opts = Object.assign({ evo: false, hall: false, duel: false, epidemic: false }, g0.opts || {});
    const g = {

    for (let k = 0; k < 3; k++) order.forEach(u => g.hands[u].push(g.deck.pop()));

  }

  function draw(g, u) {
    const h = g.hands[u];
    while (h.length < 3) {
      if (!g.deck.length) {
        if (!g.discard.length) break;
        if (g.discard.length > 1) { // la última carta descartada se queda boca arriba (la podría recuperar una Aparición); las demás se barajan y vuelven al mazo
          const top = g.discard.pop();
          g.deck = shuffle(g.discard); g.discard = [top];

  function endTurn(g) {

      const u = g.order[g.turn];

        g.log.push(g.players[u].name + ' roba cartas y pierde el turno');

      }
      break;
    }
  }

  // ---------- predicados de objetivos ----------
  // Virus (básico, evolucionado o Experimento fallido como virus: c.failed)
  function okVirus(g, u, c, pid, idx, allowSelf) {
    const sl = g.bodies[pid] && g.bodies[pid][idx];
    if (!sl) return false;
    if (pid === u && !allowSelf) return false;
    const s = st(sl);
    if (c.failed) return (s === 'infected' || (s === 'vacc' && !sl.m[0].ex)) && sl.o.c !== 'bionic';
    if (!hit(c.c, sl.o.c) || s === 'immune') return false;
    if (s === 'vacc' && !c.ev && sl.m[0].ex) return false; // un virus normal no puede quitar una vacuna experimental

    return true;
  }
  // Medicina (básica, experimental o Experimento fallido como medicina)
  function okMed(g, u, c, pid, idx) {
    const sl = g.bodies[pid] && g.bodies[pid][idx];

    if (sl.o.c === 'bionic') return false;
    const s = st(sl);
    if (c.failed) return s === 'infected' ? !sl.m[0].ev : s === 'vacc';
    if (s === 'immune') return false;
    if (!c.ex) {
      if (!hit(c.c, sl.o.c)) return false;
      return s === 'infected' ? !sl.m[0].ev : !convBlocked(g, pid, sl, c.c);
    }
    if (s === 'infected') return mm(c.c, sl.m[0].c);
    return hit(c.c, sl.o.c) && !convBlocked(g, pid, sl, c.c);
  }
  function okSteal(g, u, pid, idx, color) { // color: Ladrón de colores (cualquier estado)
    const sl = g.bodies[pid] && g.bodies[pid][idx];
    if (!sl || pid === u) return false;
    if (color) {
      if (sl.o.c === color) return canReceive(g.bodies[u], sl.o, -1);
      // El multicolor (sin convertir) también se puede robar con un Ladrón de colores, como si valiera de ese color:
      // solo si ese color no se repite ni en el cuerpo de quien roba ni en el de la víctima (su multicolor no puede valer de un color que ya tiene)
      if (sl.o.c === 'wild' && isColor(color)) return !g.bodies[u].some(s => s.o.c === color) && !g.bodies[pid].some((s, i) => i !== idx && s.o.c === color);
      return false;
    }
    return st(sl) !== 'immune' && canReceive(g.bodies[u], sl.o, -1);
  }
  function okSwap(g, u, myIdx, pid, idx) { // Trasplante: un órgano mío por uno de otro jugador, en cualquier estado
    const my = g.bodies[u][myIdx], sl = g.bodies[pid] && g.bodies[pid][idx];
    if (!my || !sl || pid === u) return false;
    return canReceive(g.bodies[u], sl.o, myIdx) && canReceive(g.bodies[pid], my.o, idx);
  }
  function okAlien(g, u, p1, i1, p2, i2) { // dos órganos de dos jugadores distintos, ninguno mío, en cualquier estado
    const a = g.bodies[p1] && g.bodies[p1][i1], b = g.bodies[p2] && g.bodies[p2][i2];
    if (!a || !b || p1 === p2 || p1 === u || p2 === u) return false;
    return canReceive(g.bodies[p1], b.o, i1) && canReceive(g.bodies[p2], a.o, i2);
  }
  function okQuar(g, u, pid, idx) {
    const sl = g.bodies[pid] && g.bodies[pid][idx];
    if (!sl || st(sl) !== 'infected') return false;
    return pid === u || cursed(g, u);
  }
  const pseudo = (a) => ({ t: a.as, c: 'any', failed: 1 });

  // Mensaje de error o null
  function check(g, u, c, a, redir) {
    const body = g.bodies[u];
    const ex = redir ? (g.redirect.excluded || []) : [];
    const notEx = p => ex.indexOf(p) < 0;
    if (c.t === 'o') {
      if (c.c === 'mutant') { if (body.length && !body[a.idx]) return 'Elige el órgano que reemplazarás.'; return null; }
      return canReceive(body, c, -1) ? null : 'Ya tienes ese órgano en tu cuerpo.';
    }
    if (c.t === 'v') return (notEx(a.pid) && okVirus(g, u, c, a.pid, a.idx, redir)) ? null : 'Ese objetivo no es válido para esta carta.';
    if (c.t === 'm') return (notEx(a.pid) && okMed(g, u, c, a.pid, a.idx)) ? null : 'Ese objetivo no es válido para esta carta.';
    switch (c.k) {
      case 'swap': return (notEx(a.pid) && okSwap(g, u, a.myIdx, a.pid, a.idx)) ? null : 'Ese intercambio no es válido.';
      case 'steal': return (notEx(a.pid) && okSteal(g, u, a.pid, a.idx)) ? null : 'Ese órgano no se puede robar.';
      case 'thief': return (notEx(a.pid) && okSteal(g, u, a.pid, a.idx, c.c)) ? null : 'Ese órgano no se puede robar.';
      case 'alien': return okAlien(g, u, a.p1, a.i1, a.p2, a.i2) ? null : 'Elige órganos de dos jugadores distintos a ti.';
      case 'quarantine': return okQuar(g, u, a.pid, a.idx) ? null : 'Elige un órgano infectado.';
      case 'failed':

        if (a.as === 'v') return (notEx(a.pid) && okVirus(g, u, pseudo(a), a.pid, a.idx, redir)) ? null : 'Solo sobre un órgano infectado o vacunado.';
        return okMed(g, u, pseudo(a), a.pid, a.idx) ? null : 'Solo sobre un órgano infectado o vacunado.';
      case 'error': case 'second': case 'trick':
        return (a.pid && a.pid !== u && g.bodies[a.pid] && notEx(a.pid)) ? null : 'Elige a otro jugador.';
      case 'bodies': return (a.dir === 1 || a.dir === -1) ? null : 'Elige un sentido.';
      case 'apparition': return g.discard.length ? null : 'No hay cartas en el descarte.';
      case 'overtime': return g.hands[u].length >= 2 ? null : 'Necesitas otras cartas en la mano.';
      case 'spread': return (a.moves === undefined || okSpread(g, u, a.moves)) ? null : 'Ese contagio no es válido: debes pasar todos los virus que puedas.';

      case 'suit': return 'Se juega como respuesta cuando te atacan.';

  }

  // Para la interfaz: ¿es válido tocar este órgano? first = primer órgano elegido (trasplantes)
  function targetOK(g, u, c, pid, idx, first, mode, redir) {
    if (redir && g.redirect && g.redirect.kind === 'spread') return spreadRedirCands(g).some(x => x.pid === pid && x.idx === idx);
    const ex = (redir && g.redirect) ? g.redirect.excluded : [];
    if (ex.indexOf(pid) >= 0 && !(c.t === 'x' && c.k === 'alien')) return false;
    if (c.t === 'o') return c.c === 'mutant' && pid === u && !!g.bodies[u][idx];
    if (c.t === 'v') return okVirus(g, u, c, pid, idx, redir);
    if (c.t === 'm') return okMed(g, u, c, pid, idx);
    switch (c.k) {
      case 'steal': return okSteal(g, u, pid, idx);
      case 'thief': return okSteal(g, u, pid, idx, c.c);
      case 'quarantine': return okQuar(g, u, pid, idx);
      case 'swap':
        if (redir) return okSwap(g, u, g.redirect.a.myIdx, pid, idx);
        if (!first) { const my = g.bodies[u][idx]; return pid === u && !!my && st(my) !== 'immune'; }
        return okSwap(g, u, first.idx, pid, idx);
      case 'alien':
        if (!first) return pid !== u && !!(g.bodies[pid] && g.bodies[pid][idx]) && Object.keys(g.bodies).some(p => p !== pid && p !== u && g.bodies[p].some((_, j) => okAlien(g, u, pid, idx, p, j)));
        return okAlien(g, u, first.pid, first.idx, pid, idx);
      case 'failed':
        if (mode === 'v') return okVirus(g, u, { failed: 1 }, pid, idx, redir);
        if (mode === 'm') return okMed(g, u, { failed: 1 }, pid, idx);
        return false;
    }

  }
  // ¿se puede tocar a este jugador como objetivo (Error médico, Segunda opinión, Truco o trato)?
  function playerOK(g, u, c, pid, redir) {
    if (c.t !== 'x' || ['error', 'second', 'trick'].indexOf(c.k) < 0) return false;
    if (pid === u || !g.bodies[pid]) return false;
    if (redir && g.redirect.excluded.indexOf(pid) >= 0) return false;
    return true;
  }

  // ---------- Contagio ----------
  // Para cada virus propio, a qué órganos libres de otros jugadores puede pasar (si el color encaja y no choca con un órgano que ya tengan)
  function spreadOptions(g, u) {
    const res = [];
    g.bodies[u].forEach((sl, si) => {
      const v = sl.m.find(x => x.t === 'v');
      if (!v) return;
      const opts = [];
      g.order.forEach(p => {
        if (p === u) return;
        g.bodies[p].forEach((o, i) => { if (st(o) === 'free' && hit(v.c, o.o.c) && !convBlocked(g, p, o, v.c)) opts.push({ p, i }); });
      });
      res.push({ si, v, opts });
    });
    return res;
  }
  // Cuántos virus se pueden pasar como máximo a la vez (cada virus a un órgano distinto). banned: órganos ya ocupados
  function matchSize(list, banned) {
    const owner = {}; let n = 0;
    const tryK = (k, seen) => {
      for (const t of list[k].opts) {
        const key = t.p + ':' + t.i;
        if (banned[key] || seen[key]) continue;
        seen[key] = 1;
        if (owner[key] === undefined || tryK(owner[key], seen)) { owner[key] = k; return true; }
      }
      return false;
    };
    for (let k = 0; k < list.length; k++) if (tryK(k, {})) n++;
    return n;
  }
  const spreadMax = (g, u) => matchSize(spreadOptions(g, u), {});
  // Reparto automático que pasa todos los virus posibles
  function spreadPlan(g, u, prot) {
    const list = spreadOptions(g, u).map(x => ({ si: x.si, opts: x.opts.filter(t => prot.indexOf(t.p) < 0) }));
    const owner = {}, tm = {};
    const tryK = (k, seen) => {
      for (const t of list[k].opts) {
        const key = t.p + ':' + t.i;
        if (seen[key]) continue;
        seen[key] = 1; tm[key] = t;
        if (owner[key] === undefined || tryK(owner[key], seen)) { owner[key] = k; return true; }
      }
      return false;
    };
    list.forEach((_, k) => tryK(k, {}));
    return Object.keys(owner).map(key => ({ si: list[owner[key]].si, p: tm[key].p, i: tm[key].i })).sort((a, b) => a.si - b.si);
  }
  // Para la interfaz: virus número k de la lista (en orden). allowed: destinos que aún permiten pasar el máximo de virus; canSkip: si se puede dejar este sin perder ninguno
  function spreadChoices(g, u, k, moves) {
    const list = spreadOptions(g, u), M = matchSize(list, {}), cur = list[k];
    if (!cur) return { allowed: [], canSkip: false, M };
    const used = {}; moves.forEach(m => { used[m.p + ':' + m.i] = 1; });
    const rest = list.slice(k + 1);
    const allowed = cur.opts.filter(t => {
      const key = t.p + ':' + t.i;
      if (used[key]) return false;
      const ban = Object.assign({}, used); ban[key] = 1;
      return moves.length + 1 + matchSize(rest, ban) === M;

  // ¿Son válidas las elecciones [{si, p, i}]? Cada virus a un órgano libre ajeno, sin repetir, y pasando TODOS los virus que se pueda
  function okSpread(g, u, moves) {
    if (!Array.isArray(moves)) return false;
    const usedS = {}, usedT = {};
    for (const m of moves) {
      if (!m || !Number.isInteger(m.si) || !Number.isInteger(m.i)) return false;
      const sl = g.bodies[u][m.si], v = sl && sl.m.find(x => x.t === 'v');
      if (!v || m.p === u || g.order.indexOf(m.p) < 0) return false;
      const t = g.bodies[m.p][m.i];
      if (!t || st(t) !== 'free' || !hit(v.c, t.o.c) || convBlocked(g, m.p, t, v.c)) return false;
      if (usedS[m.si] || usedT[m.p + ':' + m.i]) return false;
      usedS[m.si] = 1; usedT[m.p + ':' + m.i] = 1;

  // ¿A quién perjudica esta jugada? (candidatos a responder con Traje de protección)
  function victims(g, u, c, a) {
    const others = g.order.filter(p => p !== u);
    let v = [];
    if (c.t === 'v') v = [a.pid];
    else if (c.t === 'x') {
      switch (c.k) {
        case 'steal': case 'thief': case 'swap': case 'error': case 'second': case 'trick': v = [a.pid]; break;
        case 'alien': v = [a.p1, a.p2].filter(p => p !== u); break;
        case 'failed': v = a.as === 'v' ? [a.pid] : []; break;
        case 'glove': case 'bodies': v = others; break;
        case 'spread': v = (Array.isArray(a.moves) ? a.moves : spreadPlan(g, u, [])).map(m => m.p); break;

  // ---------- ejecución de una jugada ----------
  function permute(g, map) { // map: {nuevoDueño: antiguoDueño}

    Object.assign(g.bodies, nb);
  }

  function execute(g, u, c, a, prot) {
    const body = g.bodies[u];
    const nm = p => g.players[p].name, L = s => g.log.push(s);
    const D = (...cs) => g.discard.push(...cs.map(unconvert)), Q = (...cs) => g.quarantine.push(...cs);
    const on = sl => ONAME[sl.o.c].toLowerCase();

    const ST = (k, n) => { g.stats = g.stats || {}; const t = g.stats[u] = g.stats[u] || {}; t[k] = (t[k] || 0) + (n || 1); }; // estadísticas de la partida

      } else {
        EV(s === 'vacc' ? 'immunize' : 'vaccinate'); convert(sl, mc.c); sl.m.push(mc);
        L(nm(u) + (pid !== u ? ' (' + nm(pid) + ')' : '') + (s === 'vacc' ? ' inmuniza ' : ' vacuna ') + on(sl));
      }
      passCurse(pid);
    };

    if (c.t === 'o') {
      if (c.c === 'mutant' && body.length) {
        const old = body[a.idx], oname = on(old); D(old.o, ...old.m); body[a.idx] = { o: c, m: [] };
        L(nm(u) + ' reemplaza ' + oname + ' por el órgano mutante');
      } else { body.push({ o: c, m: [] }); L(nm(u) + ' pone ' + (c.c === 'mutant' ? 'el órgano mutante' : on({ o: c }))); }
    } else if (c.t === 'v') doVirus(c, a.pid, a.idx);
    else if (c.t === 'm') doMed(c, a.pid, a.idx);
    else {
      switch (c.k) {
        case 'steal': case 'thief': {

          if (c.k === 'thief' && sl.o.c === 'wild') { L(nm(u) + ' roba el órgano multicolor de ' + nm(a.pid) + ' haciéndolo pasar por ' + ONAME[c.c].toLowerCase() + ' (sigue siendo multicolor)'); break; } // solo se hace de cuenta que es de ese color para poder robarlo
          L(nm(u) + ' roba ' + on(sl) + ' de ' + nm(a.pid)); break;
        }
        case 'swap': {
          const mine = body[a.myIdx], theirs = g.bodies[a.pid][a.idx];
          body[a.myIdx] = theirs; g.bodies[a.pid][a.idx] = mine; D(c);
          L(nm(u) + ' cambia ' + on(mine) + ' por ' + on(theirs) + ' de ' + nm(a.pid)); break;
        }
        case 'alien': {
          const s1 = g.bodies[a.p1][a.i1], s2 = g.bodies[a.p2][a.i2];
          g.bodies[a.p1][a.i1] = s2; g.bodies[a.p2][a.i2] = s1; D(c);
          L(nm(u) + ' intercambia ' + on(s1) + ' de ' + nm(a.p1) + ' por ' + on(s2) + ' de ' + nm(a.p2)); break;
        }
        case 'spread': {
          const plan = Array.isArray(a.moves) ? a.moves.filter(m => prot.indexOf(m.p) < 0) : spreadPlan(g, u, prot);
          plan.forEach(m => { const sl = body[m.si]; const v = sl.m.find(x => x.t === 'v'); sl.m = sl.m.filter(x => x !== v); convert(g.bodies[m.p][m.i], v.c); g.bodies[m.p][m.i].m.push(v); });
          if (plan.length) ST('spr', plan.length);
          const quedan = body.filter(sl => sl.m.some(x => x.t === 'v')).length; // virus que no tuvieron a dónde ir
          D(c); L(nm(u) + ' contagia: pasa ' + plan.length + ' virus' + (plan.length ? ' (' + plan.map(m => 'a ' + nm(m.p)).join(', ') + ')' : '') + (quedan ? '; ' + quedan + (quedan === 1 ? ' se queda' : ' se quedan') + ' sin órgano libre donde caber' : '')); break;
        }
        case 'glove':
          g.order.forEach(p => { if (p === u || prot.indexOf(p) >= 0) return; g.discard.push(...g.hands[p]); g.hands[p] = []; g.skip[p] = true; });
          D(c); L(nm(u) + ' usa el guante de látex: los demás descartan su mano'); break;

/* Cerebro de los bots: evalúa todas las jugadas legales y elige la de mejor resultado. */
const Bot = (function () {
  const E = Engine;

  // Niveles: fácil se equivoca a propósito y no vigila al que va ganando; normal es el juego base; difícil cuenta cartas y bloquea al líder.
  const CFG = {
    easy: { noise: 10, rnd: 0.65, threat: 0, risk: false },                    // se equivoca seguido: ideal para aprender o jugar relajado
    normal: { noise: 3, rnd: 0.15, threat: 0.6, risk: false },                 // juega bien pero falla de vez en cuando
    hard: { noise: 0.1, rnd: 0, threat: 0.6, risk: false, look: { K: 4, S: 4 } } // a su máximo: imagina la respuesta del siguiente jugador
  };

  const levelOf = (g, u) => (g.players && g.players[u] && g.players[u].lvl) || (g.opts && g.opts.botLvl) || 'normal';
  const cfgOf = (g, u) => CFG[levelOf(g, u)] || CFG.normal;
  // Qué tan probable es que lo que falta por salir sean virus (0 a 1), contando las cartas que ya se vieron
  function risk(g, u) {
    const seen = {}, mark = c => { seen[c.i] = 1; };
    g.hands[u].forEach(mark); g.discard.forEach(mark); (g.quarantine || []).forEach(mark);
    g.order.forEach(p => g.bodies[p].forEach(sl => { mark(sl.o); sl.m.forEach(mark); }));
    let un = 0, vi = 0;
    E.buildDeck(g.opts || {}).forEach(c => { if (seen[c.i]) return; un++; if (c.t === 'v' || c.k === 'failed') vi++; });
    return un ? Math.min(1, vi / un / 0.3) : 0;
  }

  // Valor de un cuerpo: órganos sanos, vacunados e inmunizados suman; infectados casi no. r: riesgo de virus (solo nivel difícil).
  function S(g, p, r) {
    r = r || 0;
    let s = 0, h = 0;
    g.bodies[p].forEach(sl => {
      const st = E.st(sl);
      s += st === 'free' ? (sl.o.c === 'bionic' ? 14 : 10) - 3 * r : st === 'vacc' ? 14 + 4 * r : st === 'immune' ? 22 + 6 * r : 5;
      if (st !== 'infected') h++;
    });
    return { s: s + h * h * 2, h };
  }

  // Qué tan buena es la posición para u: mi cuerpo menos el de los rivales (más peso al que va ganando).
  function V(g, u, cfg, r) {
    cfg = cfg || CFG.normal; r = r || 0;
    if (g.status === 'ended') return g.winner === u ? 1e5 : -1e5;
    const me = S(g, u, r);
    let o = 0;
    g.order.forEach(p => {
      if (p === u) return;
      const x = S(g, p, r);
      o += (0.35 + 0.15 * x.h + (x.h >= E.goal(g) - 1 ? cfg.threat : 0)) * x.s;
    });
    let v = me.s - o / Math.max(1, (g.order.length - 1) / 2);
    if (g.curse) v += g.curse.at === u ? -18 : 6;
    return v;
  }

  // Qué tan útil es la mano que queda: cada carta vale según lo que podría hacer pronto (solo nivel difícil)
  function handValue(g, u) {
    let v = 0;
    g.hands[u].forEach(c => {
      if (c.t === 'x' && c.k === 'suit') { v += 3.5; return; }
      let use = 0;
      if (c.t === 'o') use = c.c === 'mutant' ? (g.bodies[u].length ? 2 : 0) : (E.canReceive(g.bodies[u], c, -1) ? 4 : 0);
      else if (c.t === 'v' || c.t === 'm') {
        g.order.forEach(p => g.bodies[p].forEach((sl, i) => {
          if (c.t === 'v' ? p === u : p !== u) return;
          if (!E.check(g, u, c, { pid: p, idx: i }, false)) { const st = E.st(sl); use = Math.max(use, c.t === 'v' ? (st === 'infected' ? 6 : st === 'free' ? 3 : 4) : (st === 'infected' ? 6 : 2.5)); }
        }));
      } else use = 2.5;
      v += use || 0.3;
    });
    return v;
  }

  // Cartas que el bot no ha visto (para imaginar qué pueden tener los demás)
  function unseenPool(g, u) {
    const seen = {}, mark = c => { seen[c.i] = 1; };
    g.hands[u].forEach(mark); g.discard.forEach(mark); (g.quarantine || []).forEach(mark);
    g.order.forEach(p => g.bodies[p].forEach(sl => { mark(sl.o); sl.m.forEach(mark); }));
    if (g.curse && g.curse.card) mark(g.curse.card);
    return E.buildDeck(g.opts || {}).filter(c => !seen[c.i]);
  }
  // Un posible estado real: a cada rival se le reparten cartas al azar de las que no se han visto
  function sampleWorld(g, u, pool) {
    const w = JSON.parse(JSON.stringify(g)), p = pool.slice();
    for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
    w.order.forEach(q => { if (q !== u) w.hands[q] = p.splice(0, w.hands[q].length); });

  // Mira un turno adelante: tras mi jugada, el siguiente jugador responde lo mejor que puede (según cartas imaginadas)
  function lookahead(g, u, cands, cfg, rk) {
    const pool = unseenPool(g, u), worlds = [];
    for (let s = 0; s < cfg.look.S; s++) worlds.push(sampleWorld(g, u, pool));
    cands.forEach(cd => {
      let tot = 0, n = 0;

        const r = E.apply(w, u, cd.m.c.i, cd.m.a, { noSuit: true });
        if (r.err) return;
        let after = r.g;
        const nx = after.status === 'playing' ? after.order[after.turn] : null;
        if (nx && nx !== u && !after.pending && !after.redirect) {
          let bestV = null;

            const q = E.apply(after, nx, mv.c.i, mv.a, { noSuit: true });

  const OPTS = [
    { k: 'evo', t: 'Virus! 2 Evolution', d: 'Virus evolucionados, medicinas experimentales, órgano biónico, horas extra, segunda opinión, traje de protección y cuarentena.' },
    { k: 'hall', t: 'Virus! Halloween', d: 'Órgano mutante, ladrones de colores, trasplante alienígena, aparición, experimento fallido, truco o trato y cambio de cuerpos.' },
    { k: 'epidemic', t: 'Modo epidemia', d: 'Los virus curados con una medicina experimental salen del juego (para partidas de 6).', needs: 'evo' },
    { k: 'duel', t: 'Modo duelo', d: 'Con 2 jugadores, hacen falta 5 órganos sanos (necesita Virus! 2 Evolution; sin él, 4).', needs2: true }
  ];
  function lobbyHTML() {

    const o = g.opts || {};

  function hintText() {
    if (g.status === 'ended') return '';
    if (iDefend()) return '<b>Decide</b> si usas tu Traje de protección.';
    if (g.pending) return 'Esperando la respuesta de <b>' + g.pending.holders.filter(h => g.pending.decided[h] === undefined).map(shortName).join(', ') + '</b>…';
    if (inRedir()) {
      const c = ui.sel;
      if (!c) return 'Elige un nuevo objetivo.';
      if (g.redirect.kind === 'spread') return '<b>¡Traje de protección!</b> Toca a quién rebotarle ese virus (un órgano libre de otro jugador), o déjalo con <b>' + esc(shortName(g.redirect.u)) + '</b>, que contagió.';
      if (g.redirect.by) return '<b>¡Traje de protección!</b> Toca a quién rebotarle el virus (cualquier cuerpo menos el tuyo) o descártalo.';
      const where = (c.t === 'v' || c.k === 'failed') ? ' (puede ser tu propio cuerpo)' : '';
      return '<b>Traje de protección.</b> Elige otro objetivo' + where + ', o pulsa «Sin objetivo».';
    }
    if (g.redirect) return g.redirect.by ? '<b>' + esc(shortName(g.redirect.by)) + '</b> usó su Traje de protección y decide a quién rebotar el virus…' : '<b>' + esc(shortName(g.redirect.u)) + '</b> busca otro objetivo…';
    if (ui.info && !ui.sel && !ui.disc) return esc(ui.info);
    if (!myTurn()) return isBot(g.order[g.turn]) ? '<b>' + esc(shortName(g.order[g.turn])) + '</b> está pensando…' : 'Turno de <b>' + esc(shortName(g.order[g.turn])) + '</b>. Espera tu turno.';
    if (ui.err) return '<span class="err" style="margin:0">' + esc(ui.err) + '</span>';
    const ex = myExtra();
    const pre = ex ? ({ overtime: '<b>Horas extra:</b> ', second: '<b>Segunda opinión:</b> ', apparition: '<b>Aparición:</b> ' }[ex.kind] || '') : '';
    if (ui.disc) return pre + 'Toca ' + (ex ? 'la carta que no puedas jugar' : 'de 1 a 3 cartas para descartarlas') + '.';
    const c = ui.sel;
    if (!c) {
      if (ex) {
        if (ex.kind === 'overtime') return pre + 'juega tus otras cartas (te quedan ' + ex.n + ').';
        if (ex.kind === 'second') return pre + 'juega una de las cartas recibidas o termina tu turno.';
        if (ex.kind === 'apparition') return pre + 'juega la carta recuperada o termina tu turno.';
      }
      if (!myHand().length) return '<b>Tu turno.</b> No tienes cartas: pasa el turno.';
      return '<b>Tu turno.</b> Elige una carta para jugar o descarta de 1 a 3.';
    }
    if (needsNoTarget(c) && !playableNow(c)) {
      if (myExtra() && c.t === 'x' && ['overtime', 'second', 'apparition'].indexOf(c.k) >= 0) return 'Esa carta no se puede jugar dentro de un turno extra. Cancela y descártala.';
      if (c.t === 'o') return 'Ya tienes ese órgano. Elige otra carta.';
      if (c.k === 'apparition') return 'No hay cartas en el descarte.';
      if (c.k === 'overtime') return 'Necesitas otras cartas en la mano.';
    }
    if (c.t === 'o') {
      if (c.c === 'mutant') return g.bodies[me].length ? 'Toca el órgano de tu cuerpo que quieres reemplazar.' : 'Pon el órgano mutante en tu cuerpo.';
      return E.canReceive(g.bodies[me], c, -1) ? 'Pon este órgano en tu cuerpo.' : 'Ya tienes ese órgano. Elige otra carta.';
    }
    if (c.t === 'v') return 'Toca el órgano rival que quieres infectar' + (c.ev ? ' (virus evolucionado)' : '') + '.';
    if (c.t === 'm') return E.cursed(g, me) ? 'Toca un órgano para curarlo o vacunarlo (con Truco o trato puedes ayudar a otros).' : 'Toca uno de tus órganos para curarlo, vacunarlo o inmunizarlo.';
    switch (c.k) {
      case 'swap': return !ui.first ? 'Primero toca uno de tus órganos (aunque esté infectado, vacunado o inmunizado).' : 'Ahora toca el órgano rival que quieres recibir (en cualquier estado).';
      case 'alien': return !ui.first ? 'Toca un órgano de otro jugador (en cualquier estado). No sirve con los tuyos.' : 'Ahora toca un órgano de un jugador distinto (tampoco tuyo): se intercambian entre ellos.';
      case 'steal': return 'Toca el órgano rival que quieres robar.';
      case 'thief': return 'Toca un órgano de ' + E.ONAME[c.c].toLowerCase() + ' de otro jugador (aunque esté inmunizado), o su órgano multicolor si ni tú ni él tienen ya ' + E.ONAME[c.c].toLowerCase() + '.';
      case 'quarantine': return E.cursed(g, me) ? 'Toca un órgano infectado (tuyo o de otro) para aislar su virus.' : 'Toca uno de tus órganos infectados para aislar su virus.';
      case 'failed': return !ui.mode ? 'Elige si actúa como virus o como medicina.' : (ui.mode === 'v' ? 'Toca un órgano rival infectado o vacunado.' : 'Toca un órgano tuyo infectado o vacunado.');
      case 'error': return 'Toca al jugador con quien cambiarás de cuerpo.';
      case 'second': return 'Toca al jugador con quien cambiarás de mano.';
      case 'trick': return 'Toca al jugador que quedará maldito: no podrá ganar.';
      case 'bodies': return 'Elige el sentido en que todos pasan su cuerpo.';
      case 'suit': return 'Se juega como respuesta cuando alguien te ataca.';
      case 'spread': {
        if (E.spreadMax(g, me) === 0) return 'No tienes virus que puedan pasar a otros órganos libres.';
        const s = spChoice();
        return s.done ? 'Pasa tus virus a órganos libres de otros jugadores.' : 'Contagio · virus ' + (s.moves.length + 1) + ' de ' + s.ch.M + ' (de tu ' + E.ONAME[g.bodies[me][s.cur.si].o.c].toLowerCase() + '): toca el órgano libre que lo recibirá. Debes pasar todos los que puedas.' + (s.ch.canSkip ? ' Puedes dejar este si otro ocupa su lugar.' : '');
      }
      case 'glove': return 'Todos los demás descartan su mano y pierden su siguiente turno.';
      case 'overtime': return 'Después podrás jugar tus otras dos cartas.';
      case 'apparition': return g.discard.length ? 'Recuperas la última carta del descarte.' : 'No hay cartas en el descarte.';
    }
    return '';
  }

  function trayHTML() {
    const hand = myHand();
    const mt = canAct();
    const ex = myExtra();
    const cards = hand.map(c => cardHTML(c, { sel: ui.sel && ui.sel.i === c.i, dsel: ui.dsel.indexOf(c.i) >= 0 })).join('');
    let bar = '';
    if (inRedir()) {

  async function buildShareImage() {

    const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#1B6B58'); bg.addColorStop(1, '#0A2A23'); c.fillStyle = bg; c.fillRect(0, 0, W, H);
    const rg = c.createRadialGradient(W / 2, 420, 60, W / 2, 420, 700); rg.addColorStop(0, 'rgba(255,255,255,.18)'); rg.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = rg; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 6; c.strokeRect(24, 24, W - 48, H - 48);

    c.font = '800 110px ' + F; c.fillText('VIRUS!', W / 2, 150);

    const circle = (img, pl, cx, cy, r, ring) => {
      c.save(); c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.closePath(); c.fillStyle = '#fff'; c.fill(); c.clip();
      if (img) c.drawImage(img, cx - r, cy - r, r * 2, r * 2); else { c.fillStyle = '#E8EEF1'; c.fillRect(cx - r, cy - r, r * 2, r * 2); c.fillStyle = '#22232B'; c.textBaseline = 'middle'; c.font = Math.round(r * 1.1) + 'px Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif'; c.fillText((pl && pl.av) || '🙂', cx, cy + r * .05); c.textBaseline = 'alphabetic'; }
      c.restore(); if (ring) { c.lineWidth = ring; c.strokeStyle = '#F2C230'; c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke(); }
    };

    c.fillStyle = '#fff'; c.font = '800 80px ' + F; c.fillText(wp.name, W / 2, 650);
    c.font = '700 44px ' + EM + F; c.fillStyle = '#F2C230'; c.fillText('🏆 ganó la partida' + (g.turns ? ' · ' + g.turns + ' turnos' : ''), W / 2, 715);
    let y = 775; c.font = '600 34px ' + EM + F; c.fillStyle = 'rgba(255,255,255,.9)';
    highlights().forEach(t => { c.fillText(t, W / 2, y); y += 48; });
    y = Math.max(y + 20, 860);
    const rows = scoreRows(); const ids = Object.keys(g.players), st = g.stats || {};
    rows.sort((a, b) => (b.u === g.winner) - (a.u === g.winner) || b.n - a.n);
    const rh = Math.min(96, Math.floor((H - 130 - y) / Math.max(1, rows.length)));
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i], pl = g.players[r.u], cy = y + i * rh + rh / 2;
      c.fillStyle = r.u === g.winner ? 'rgba(242,194,48,.22)' : 'rgba(255,255,255,.08)'; c.beginPath(); c.roundRect ? c.roundRect(70, cy - rh / 2 + 4, W - 140, rh - 8, 22) : c.rect(70, cy - rh / 2 + 4, W - 140, rh - 8); c.fill();
      circle(await avatarImg(pl, 200), pl, 130, cy, Math.min(34, rh / 2 - 8), 0);
      c.textAlign = 'left'; c.fillStyle = '#fff'; c.font = '700 40px ' + F; c.fillText(pl.name, 190, cy + 14);
      const s2 = st[r.u] || {}; const bits = [s2.inf ? '🦠 ' + s2.inf : '', s2.cur ? '💊 ' + s2.cur : '', s2.des ? '💥 ' + s2.des : ''].filter(Boolean).join('   ');
      c.textAlign = 'right'; c.font = '600 30px ' + EM + F; c.fillStyle = 'rgba(255,255,255,.75)'; c.fillText(bits, W - 260, cy + 11);
      c.font = '800 44px ' + EM + F; c.fillStyle = '#F2C230'; c.fillText(r.n > 0 ? '🏆 ' + r.n : '', W - 100, cy + 14);

        (g.host === me ? '<button class="btn" data-act="again">Nueva partida</button>' : '<button class="btn alt" disabled>Esperando al anfitrión</button>') +

      '<div class="felt">' +
      '<div class="stage" style="--side:' + (sides ? '92px' : '0px') + '">' +

  let clockTimer = null, clockKey = '', clockStart = 0;
  function clockRender() {
    if (!g || g.status !== 'playing') return;
    const now = Date.now();
    const cd = document.getElementById('cdw');
    if (cd && g.pending) cd.textContent = Math.max(0, Math.ceil((PEND_MS() - 500 - (now - clockStart)) / 1000));
    const tt = document.getElementById('tt');
    if (tt) {
      const a = actorNow();
      if (a && !isBot(a) && isFinite(limitMs(a))) {

      } else tt.textContent = '';

  function readInputs() {

  // ---------- eventos ----------
  window.addEventListener('virus-voice', () => { if (g) render(); });
  // Mantener presionada una carta de tu mano (o clic derecho) muestra qué hace
  let lpTimer = null, lpFired = false, lpX = 0, lpY = 0;

  app.addEventListener('change', e => { const t = e.target; if (t && t.dataset && t.dataset.photo) { const f = t.files && t.files[0]; t.value = ''; processPhoto(f); } });
  app.addEventListener('input', e => { const t = e.target; if (t && t.dataset && t.dataset.vol === 'sfx') store.set('virus.sfxvol', String(t.value / 100)); });

    if (act === 'create') return createRoom();
    if (act === 'join') { readInputs(); return join(ui.code, false); }
    if (act === 'leave') return leave();
    if (act === 'start') return startGame();
    if (act === 'again') return again();
    if (act === 'addbot') return addBot();
    if (act === 'rmbot') return removeBot(t.dataset.p);
    if (act === 'menu') { ui.menu = !ui.menu; ui.confirm = ''; return render(); }
    if (act === 'menu-reset') { if (ui.confirm === 'reset') return resetToLobby(); ui.confirm = 'reset'; return render(); }
    if (act === 'menu-close') { if (ui.confirm === 'close') return closeRoom(); ui.confirm = 'close'; return render(); }

        ui.first = null; ui.mode = (ui.sel && ui.sel.k === 'failed') ? null : null; ui.err = ''; ui.info = '';
        const ex = myExtra();
        if (ex && ex.only && ui.sel && ex.only.indexOf(ui.sel.i) < 0) { ui.err = 'Solo puedes jugar la carta recuperada.'; ui.sel = null; }
        else if (ex && ui.sel && ui.sel.t === 'x' && ['overtime', 'second', 'apparition'].indexOf(ui.sel.k) >= 0) { ui.err = 'Esa carta no se puede jugar dentro de un turno extra. Descártala o juega otra.'; ui.sel = null; }
      }
      return render();
    }
    if (act === 'disc') { ui.disc = true; ui.sel = null; ui.first = null; ui.mode = null; ui.err = ''; ui.info = ''; return render(); }
    if (act === 'cancel') { ui.disc = false; ui.dsel = []; ui.sel = null; ui.first = null; ui.mode = null; ui.err = ''; ui.info = ''; return render(); }
    if (act === 'discgo') return discard();
    if (act === 'playnow') return play({});
    if (act === 'pass') return doPass();
    if (act === 'dir') return play({ dir: +t.dataset.d });
    if (act === 'mode') { ui.mode = t.dataset.m; ui.first = null; ui.err = ''; return render(); }
    if (act === 'organ') return tapOrgan(t.dataset.p, +t.dataset.i);
    if (act === 'player') { if (ui.sel && playerTarget(t.dataset.p)) return play({ pid: t.dataset.p }); }
  });
  app.addEventListener('input', () => readInputs());

  window.addEventListener('virus-net', () => { if (g) render(); });
  init();
})();

</script>
<div id="updbar"><span>Hay una versión nueva del juego</span><button type="button" onclick="location.reload()">Actualizar</button></div>
<button class="installpill" id="installpill" type="button">📲 Instalar app</button>
<script>
(function () {
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/[?&]nosw/.test(location.search)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
  var had = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!had) { had = true; return; } // primera instalación: no hay nada que actualizar
      if (!document.querySelector('.top, .room-code')) { location.reload(); return; } // en la pantalla de inicio se recarga sola
      document.getElementById('updbar').classList.add('show'); // en una sala, se avisa para no interrumpir
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }).catch(function () { }); });
  }
  var pill = document.getElementById('installpill'), evt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); evt = e; refresh(); });
  window.addEventListener('appinstalled', function () { evt = null; refresh(); });
  function refresh() { pill.classList.toggle('show', !!evt && !standalone && !document.querySelector('.top, .room-code')); }
  setInterval(refresh, 800);
  pill.addEventListener('click', function () { if (!evt) return; var e = evt; evt = null; refresh(); e.prompt(); });
})();
</script>
</body>
</html>
